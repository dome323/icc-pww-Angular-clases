<header class ="header">
  <h1>{{ brand() }}</h1>
  
    <button (click)="changeBrand()">
        Modificar Titulo
    </button>
    <button (click)="resetBrand()"
            [disabled]="brand() === 'PPW Angular'"]
          >
        Resetear Titulo
    </button>
    <button (click)="toggleInfo()">
      {{ toggleLabel() }}
    </button>
  


  @if(showInfo()){
    <h3>Show Info es TRUE por eso muestra la información</h3>
  }

</header>
